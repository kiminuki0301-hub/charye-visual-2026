name: Add airport article photo

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-airport-photo.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fetch article photo and patch page
        run: |
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import unquote
          import re, html as htmlmod

          article_url = "https://www.asiae.co.kr/article/2026091916505162812"
          caption = "지난해 추석 황금연휴를 앞두고 인천국제공항 제1여객터미널을 찾은 여행객들이 발권하기 위해 줄을 서 있다."

          req = Request(article_url, headers={"User-Agent":"Mozilla/5.0"})
          raw = urlopen(req, timeout=30).read().decode("utf-8", "ignore")
          raw_dec = htmlmod.unescape(raw)

          pos = raw_dec.find(caption)
          if pos < 0:
              # tolerate minor whitespace/markup differences
              key = "인천국제공항 제1여객터미널"
              pos = raw_dec.find(key)
          if pos < 0:
              raise SystemExit("Target caption not found in source article HTML")

          window = raw_dec[max(0,pos-30000):pos+10000]
          urls = re.findall(r'https?://[^\\"\'<>\s]+?(?:\.jpe?g|\.png|\.webp)(?:\?[^\\"\'<>\s]*)?', window, flags=re.I)
          urls = [u.replace("\\/","/") for u in urls]
          # Prefer Asiae photo CDN and the nearest occurrence before the caption.
          preferred = [u for u in urls if "cphoto.asiae.co.kr" in u or "asiae" in u]
          candidates = preferred or urls
          if not candidates:
              raise SystemExit("No image URL found near caption")
          image_url = candidates[-1]

          Path("assets").mkdir(exist_ok=True)
          ext = ".jpg"
          if ".png" in image_url.lower(): ext=".png"
          elif ".webp" in image_url.lower(): ext=".webp"
          img_path = Path("assets") / ("airport-chuseok" + ext)
          img_req = Request(image_url, headers={"User-Agent":"Mozilla/5.0","Referer":article_url})
          img_path.write_bytes(urlopen(img_req, timeout=30).read())

          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          # Remove an earlier version if workflow is re-run.
          s = re.sub(r'\s*<figure class="article-figure reveal figure-reveal airport-photo">[\s\S]*?</figure>\s*', "\n", s)
          target = '<p class="reveal">연구원 측은 이번 조사에서'
          idx = s.find(target)
          if idx < 0:
              raise SystemExit("Final research paragraph anchor not found")
          figure = f'''  <figure class="article-figure reveal figure-reveal airport-photo">
           <img src="{img_path.as_posix()}" alt="추석 황금연휴를 앞둔 인천국제공항 제1여객터미널 여행객들" loading="lazy">
           <figcaption>{caption} <span class="credit">아시아경제</span></figcaption>
          </figure>\n\n'''
          s = s[:idx] + figure + s[idx:]
          p.write_text(s, encoding="utf-8")
          print("IMAGE_URL=" + image_url)
          print("IMAGE_PATH=" + img_path.as_posix())
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/
          git diff --cached --quiet || git commit -m "Add airport photo to closing section"
          git push

name: Patch visual news copy

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/patch-copy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Update copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace("음식이 하나 늘 때마다<br>노동도 한 겹 늘어난다", "음식이 하나 늘 때마다<br>몸은 바빠진다")
          s = s.replace("상은 가득 찼고,<br>하루는 거의 비었다.", "상은 가득 찼고,<br>노동으로 고된 하루가 지났다.")
          p.write_text(s, encoding="utf-8")
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Revise visual news copy"
          git push

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>기사 삽입 테스트</title><style>*{box-sizing:border-box}body{margin:0;overflow-x:hidden;font-family:Arial,"Malgun Gothic",sans-serif;color:#142a37}.article{width:min(calc(100% - 32px),760px);margin:45px auto;line-height:1.7}.article h1{font-size:clamp(2rem,4vw,3.4rem);line-height:1.25}.visual-wrap{position:relative;width:min(1400px,100vw);max-width:none;margin-left:50%;transform:translateX(-50%);overflow:hidden}.visual-wrap iframe{display:block;width:100%;height:900px;border:0;overflow:hidden}</style></head><body><article class="article"><h1>엄마 아빠, 집 사고 싶어요. 대출해 주세요</h1><p>기사 본문 안 삽입 폭과 단일 스크롤을 확인하기 위한 시험 화면입니다.</p><div class="visual-wrap"><iframe id="bankVisual" src="./index.html" title="20대 주택 매수자금 비주얼뉴스" scrolling="no" loading="eager"></iframe></div><p>이 문단은 비주얼뉴스가 끝난 직후 이어져야 합니다. iframe 내부에 스크롤이 생기거나 이 문단 앞에 큰 빈 공간이 있다면 삽입 환경을 다시 점검해야 합니다.</p></article><script>(function(){const f=document.getElementById('bankVisual');const origin=new URL(f.src,location.href).origin;window.addEventListener('message',function(e){if(e.source!==f.contentWindow||e.origin!==origin||!e.data||e.data.type!=='bank-of-parents-height')return;const h=Number(e.data.height);if(Number.isFinite(h)&&h>400&&h<30000)f.style.height=Math.ceil(h)+'px'})})();</script></body></html>

<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Viewport QA</title><style>body{margin:0;background:#d5d7d2;font:14px Arial,sans-serif}.info{position:sticky;top:0;background:white;padding:8px;z-index:2}iframe{display:block;border:0;background:white;margin:auto;height:900px}</style></head><body><div class="info" id="info"></div><iframe id="story" scrolling="no" title="반응형 화면 시험"></iframe><script>const params=new URLSearchParams(location.search);const width=Math.min(1920,Math.max(320,Number(params.get('w'))||375));const iframe=document.getElementById('story');iframe.style.width=width+'px';iframe.src='./index.html?qa='+encodeURIComponent(params.get('revision')||'latest');document.getElementById('info').textContent=width+'px';window.addEventListener('message',e=>{if(e.source!==iframe.contentWindow||e.origin!==location.origin||e.data?.type!=='bank-of-parents-height')return;iframe.style.height=Math.ceil(e.data.height)+'px'});</script></body></html>
